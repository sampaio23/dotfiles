# Prefix: C-Space instead of default C-b
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Mouse on by default (click panes/windows, drag borders, scroll)
set -g mouse on

# Pane navigation, no prefix needed (repeatable, fast switching)
# Ctrl-Shift instead of Alt to avoid clash w/ Alt+arrow in neovim
bind -n C-S-Left  select-pane -L
bind -n C-S-Right select-pane -R
bind -n C-S-Up    select-pane -U
bind -n C-S-Down  select-pane -D

# Window (tab) navigation, no prefix needed
bind -n M-S-Left  previous-window
bind -n M-S-Right next-window

# Window root — set to current pane's directory, no prompt
bind R run-shell "tmux set-option -w @root '#{pane_current_path}'"

# cd to root of current window (noop if @root not set)
bind r run-shell "tmux send-keys 'cd #{@root}' Enter"

# Splits — all respect @root when set, else open at current pane dir
# -h = vertical divider (left/right), -v = horizontal divider (top/bottom)
bind s split-window -h -c "#{?#{@root},#{@root},#{pane_current_path}}"
bind % split-window -h -c "#{?#{@root},#{@root},#{pane_current_path}}"
bind '"' split-window -v -c "#{?#{@root},#{@root},#{pane_current_path}}"

# Rename current window (prompts inline)
bind , command-prompt -I "#W" "rename-window '%%'"

# Note: new window = default bind `C-a c` (built-in, unaffected above)
# Note: close pane   = default bind `C-a x` (built-in, confirm prompt)
