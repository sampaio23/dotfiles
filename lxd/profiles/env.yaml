name: env
description: ""
config:
  user.user-data: |
    #cloud-config

    package_update: true
    packages:
      - neovim
      - git
      - stow

    runcmd:
      - runuser -l ubuntu -c 'git clone https://github.com/sampaio23/dotfiles.git ~/.dotfiles'
      - runuser -l ubuntu -c 'cd ~/.dotfiles && stow nvim'
      - runuser -l ubuntu -c 'nvim --headless "+Lazy! sync" +qa'
devices: {}
