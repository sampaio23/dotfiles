# ~/.config/foot/foot.ini

# Set your preferred font and size
font=JetBrainsMono Nerd Font:size=11

pad=5x5

[cursor]
style=block
blink=yes

[colors-dark]
# A clean dark theme that matches modern setups
background=1e1e2e
foreground=cdd6f4
regular0=45475a  # black
regular1=f38ba8  # red
regular2=a6e3a1  # green
regular3=f9e2af  # yellow
regular4=89b4fa  # blue
regular5=f5c2e7  # magenta
regular6=94e2d5  # cyan
regular7=bac2de  # white

[csd]
# Disable foot's client-side window decoration title bars 
# and let Niri handle the clean window edges entirely
preferred=none
